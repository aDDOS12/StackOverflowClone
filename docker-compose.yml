x-db-connection-string: &db-connection-string "Server=db,1433;Database=StackOverflowClone;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrator:
    build:
      context: .
      target: migrator
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__StackOverflowDbConnectionString: *db-connection-string

  api:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__StackOverflowDbConnectionString: *db-connection-string
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "8080:8080"

volumes:
  sqldata: